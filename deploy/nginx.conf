# /etc/nginx/sites-available/edupulse.conf
# EduPulse LMS Production Nginx Reverse Proxy with Native WebSockets & CORS

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream edupulse_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name lms.xoxod33p.tech;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lms.xoxod33p.tech;

    # SSL Certificate configuration (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/lms.xoxod33p.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.xoxod33p.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Max body upload size for LMS materials, assignments, and videos
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cache Next.js static chunks
    location /_next/static/ {
        proxy_pass http://edupulse_upstream;
        proxy_cache_valid 200 365d;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files
    location /public/ {
        proxy_pass http://edupulse_upstream;
        add_header Cache-Control "public, max-age=86400";
    }

    # Native WebSocket endpoint
    location /ws {
        proxy_pass http://edupulse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and extend timeouts for persistent real-time connections
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Main Application & API proxy
    location / {
        # CORS Handling for lms.xoxod33p.tech
        if ($http_origin ~* "^https?://([a-z0-9-]+\.)*xoxod33p\.tech(:[0-9]+)?$") {
            add_header "Access-Control-Allow-Origin" "$http_origin" always;
            add_header "Access-Control-Allow-Credentials" "true" always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
            add_header "Access-Control-Allow-Headers" "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,Range,X-CSRF-Token,Accept,Accept-Version,Content-Length,Date,X-Api-Version,edupulse_session" always;
            add_header "Access-Control-Expose-Headers" "Content-Length,Content-Range,Accept-Ranges" always;
        }

        if ($request_method = 'OPTIONS') {
            add_header "Access-Control-Allow-Origin" "$http_origin" always;
            add_header "Access-Control-Allow-Credentials" "true" always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
            add_header "Access-Control-Allow-Headers" "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,Range,X-CSRF-Token,Accept,Accept-Version,Content-Length,Date,X-Api-Version,edupulse_session" always;
            add_header "Access-Control-Max-Age" 86400;
            add_header "Content-Type" "text/plain; charset=utf-8";
            add_header "Content-Length" 0;
            return 204;
        }

        proxy_pass http://edupulse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
